name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_USER: tracker
          MYSQL_PASSWORD: tracker
          MYSQL_DATABASE: tracker
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: mysql://tracker:tracker@127.0.0.1:3306/tracker
      BETTER_AUTH_SECRET: ci-secret-not-used-in-production-0123456789
      CREDENTIALS_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      FILE_URL_SECRET: ci-file-secret
      APP_URL: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Apply migrations to a fresh database
        run: pnpm db:migrate
      - name: Schema and database agree (no drift)
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Database tests (MySQL behaviour)
        run: pnpm db:seed && pnpm test:db
      - run: pnpm build
      - name: Pack the deploy bundle for cPanel (standalone server, worker, migrator)
        run: bash scripts/pack-deploy.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deploy-bundle
          path: deploy.tar.gz
          retention-days: 14
      - name: Publish the bundle as release deploy-<branch> (read by scripts/cpanel/deploy.sh)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="deploy-${GITHUB_REF_NAME//\//-}"
          notes="Prebuilt bundle for scripts/cpanel/deploy.sh. Branch $GITHUB_REF_NAME, commit $GITHUB_SHA."
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --target "$GITHUB_SHA" --title "Deploy bundle ($GITHUB_REF_NAME)" --notes "$notes"
          fi
          gh release upload "$tag" deploy.tar.gz --clobber
          gh release edit "$tag" --notes "$notes"
