---
# Runs when cPanel > Git Version Control > "Deploy HEAD Commit" is used.
# Shared plans kill `pnpm install` and `next build` (1 GB limit), so nothing is built here:
# CI builds a ready-to-run bundle on every push and publishes it as the release "deploy-<branch>".
# This downloads that bundle into ~/tracker, runs the migrations and restarts the app.
# Wait for the GitHub Actions run of your commit to finish before deploying.
deployment:
  tasks:
    - /bin/bash scripts/cpanel/deploy.sh
